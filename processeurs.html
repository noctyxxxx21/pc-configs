<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Processeurs - PC CONFIGS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
        }

        header {
            padding: 30px;
            background: #151923;
            border-bottom: 1px solid #252b38;
        }

        header a {
            color: #9ca3af;
            text-decoration: none;
        }

        header h1 {
            margin-top: 15px;
            font-size: 32px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .search {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #303746;
            background: #181c25;
            color: white;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .product {
            background: #181c25;
            border: 1px solid #292f3c;
            border-radius: 15px;
            padding: 25px;
        }

        .product h2 {
            margin-bottom: 10px;
        }

        .specs {
            color: #9ca3af;
            margin-bottom: 20px;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .best {
            color: #4ade80;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .buy {
            display: block;
            text-align: center;
            padding: 12px;
            background: #5865f2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .buy:hover {
            background: #4752c4;
            
            .sellers {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
}

.seller {

    grid-template-columns: 1fr auto auto;
    gap: 10px;
    align-items: center;
    padding: 10px;
    background: #10131a;
    border-radius: 8px;
}

.seller strong {
    white-space: nowrap;
}

.seller a {
    background: #5865f2;
    color: white;
    text-decoration: none;
    padding: 7px 10px;
    border-radius: 6px;
}
        }
    </style>
</head>

<body>

<header>

    <h1>🧠 Processeurs</h1>
</header>

<div class="container">

    <input
    class="search"
    id="search"
    type="text"
    placeholder="🔎 Rechercher un processeur..."
>

    <div class="products">

        </div>

    </div>

</div>
<script src="produits.js"></script>

    const search = document.getElementById("search");

        container.innerHTML = "";

        liste
            .filter(produit => produit.categorie === "Processeurs")
            .forEach(produit => {

                );

                const card = document.createElement("div");
                card.className = "product";

produit.vendeurs
    .sort((a, b) => a.prix - b.prix)

    afficherProduits(produits);

    search.addEventListener("input", function () {
        const texte = search.value.toLowerCase();

</html>
